name: Historia
description: Historia de usuario (HU) o técnica (HT)
title: "HT-000: "
labels: ["historia"]
body:
  - type: input
    id: requisito
    attributes:
      label: Requisitos que cubre
      placeholder: RNF-CAL-03, CA-21
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Dado / Cuando / Entonces, o lista verificable.
    validations:
      required: true
  - type: dropdown
    id: horas
    attributes:
      label: Horas estimadas
      description: Más de 8 h se parte.
      options: ["1", "2", "3", "5", "8"]
    validations:
      required: true
  - type: input
    id: depende
    attributes:
      label: Depende de
      placeholder: HT-001
