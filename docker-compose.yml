name: optimus-thy

# Red interna por defecto. Sin red externa.
networks:
  default:
    name: ${COMPOSE_NETWORK:?COMPOSE_NETWORK requerido}
    driver: bridge

volumes:
  pgdata:
  miniodata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optimus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-local}
      POSTGRES_DB: ${POSTGRES_DB:-optimus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optimus} -d ${POSTGRES_DB:-optimus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    # MinIO sirve como almacenamiento compatible con S3 en local (ADR-014, fijado por digest).
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-cambiar-en-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-cambiar-en-local}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://optimus:cambiar-en-local@postgres:5432/optimus}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cambiar-en-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cambiar-en-local}
      S3_BUCKET: ${S3_BUCKET:-optimus}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-cambiar-en-local-no-usar-fuera-de-desarrollo}
      OCR_URL: ${OCR_URL:-http://ocr:8001}
      IA_URL: ${IA_URL:-http://ia:8002}
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  ocr:
    build:
      context: ./ocr
      # El SDK de GLM-OCR (torch, transformers) solo entra en la imagen si se pide.
      args:
        INSTALAR_GLM: ${OCR_INSTALAR_GLM:-false}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      OCR_MOTOR: ${OCR_MOTOR:-glm}
      OCR_MODELO_DIR: /modelos/glm-ocr
      OCR_MAX_BYTES: ${OCR_MAX_BYTES:-20971520}
      OCR_PERMITIR_API_EXTERNA: ${OCR_PERMITIR_API_EXTERNA:-false}
    volumes:
      # Pesos de GLM-OCR (layout + modelo) montados de solo lectura.
      - ${OCR_MODELOS_DIR:-./var/modelos-glm}:/modelos:ro
    expose:
      - "8001"
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ia:
    build:
      context: ./ia
      # El stack de inferencia (~2 GB) solo entra en la imagen si se pide:
      # sin esta bandera el servicio arranca en degradado.
      args:
        INSTALAR_MODELOS: ${IA_INSTALAR_MODELOS:-false}
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      IA_MODELOS_DIR: /modelos
      IA_DISPOSITIVO: ${IA_DISPOSITIVO:-cpu}
    volumes:
      # Solo lectura: los pesos viven fuera del repo y nunca se versionan.
      - ${IA_MODELOS_DIR:-./var/modelos}:/modelos:ro
    expose:
      - "8002"
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-18443}:8443"
    environment:
      HTTPS_PORT: "${HTTPS_PORT:-18443}"
      HTTP_PORT: "${HTTP_PORT:-8080}"
      NGINX_ENVSUBST_FILTER: "^(HTTPS_PORT|HTTP_PORT)$"
    volumes:
      - ./infra/nginx:/etc/nginx/templates:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/healthz"]
