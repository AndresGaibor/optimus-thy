[project]
name = "optimus-ocr"
version = "1.0.0"
description = "Servicio de OCR local de OPTIMUS-THY: contrato 1.1 con motores GLM-OCR y Tesseract."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
# Motor por defecto. El extra `selfhosted` trae torch/transformers en CPU; el
# modelo se sirve con vLLM, SGLang, Ollama o MLX en 127.0.0.1 (ver
# requirements-glm.txt y docs/arquitectura/servicio-ocr.md).
glm = ["glmocr[selfhosted]>=0.1.5"]
# Alternativa ligera: Tesseract y el rasterizado de PDF sin torch.
tesseract = ["pymupdf>=1.24", "pytesseract>=0.3.13", "pillow>=10"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
