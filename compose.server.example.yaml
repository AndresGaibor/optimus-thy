# Overlay de producción. La instalación lo copia como compose.server.yaml.
# RELEASE, TAILSCALE_IP, APP_DIR y RELEASE_DIR son requeridos.
services:
  postgres:
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2g

  storage:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m

  backend:
    image: optimus-thy-backend:${RELEASE:?RELEASE requerido}
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2g

  frontend:
    image: optimus-thy-frontend:${RELEASE:?RELEASE requerido}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m

  ocr:
    image: optimus-thy-ocr:${RELEASE:?RELEASE requerido}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g

  ia:
    image: optimus-thy-ia:${RELEASE:?RELEASE requerido}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g

  edge:
    ports: !override
      - "${TAILSCALE_IP:?TAILSCALE_IP requerido}:${HTTPS_PORT:-18443}:8443"
    volumes: !override
      - "${RELEASE_DIR:?RELEASE_DIR requerido}/infra/nginx:/etc/nginx/templates:ro"
      - "${APP_DIR:?APP_DIR requerido}/infra/nginx/certs:/etc/nginx/certs:ro"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
