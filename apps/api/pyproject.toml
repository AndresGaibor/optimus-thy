[project]
name = "optimus-thy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.53",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: tests that require PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["optimus_thy"]
